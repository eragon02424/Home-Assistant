name: "MCP Second Brain"
description: "MCP Server mit Lese-/Schreibzugriff ausschließlich auf den Second-Brain-Ordner"
version: "1.0.0"
slug: "mcp_second_brain"
url: "https://github.com/eragon02424/Home-Assistant"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ports:
  8773/tcp: 8773
ports_description:
  8773/tcp: "MCP Streamable HTTP (/mcp)"
map:
  - type: share
    read_only: false
options:
  folder: /share/second_brain
  read_only: false
  max_file_kb: 512
  create_structure: true
schema:
  folder: match(^/share/.+)
  read_only: bool
  max_file_kb: int(16,4096)
  create_structure: bool
