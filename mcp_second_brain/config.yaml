name: "MCP Second Brain"
description: "MCP Server für getrennte Second Brains (LLM-Wiki: privat, beruf) - Zugriff ausschließlich auf den Second-Brain-Ordner"
version: "3.0.0"
slug: "mcp_second_brain"
url: "https://github.com/eragon02424/Home-Assistant"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ports:
  8773/tcp: 8773
ports_description:
  8773/tcp: "MCP Streamable HTTP (/mcp)"
map:
  - type: share
    read_only: false
options:
  folder: /share/second_brain
  brains: "privat,beruf"
  read_only: false
  max_file_kb: 512
  max_upload_mb: 50
  import_dir: ""
schema:
  folder: match(^/share/.+)
  brains: match(^[a-z0-9_-]+(,[a-z0-9_-]+)*$)
  read_only: bool
  max_file_kb: int(16,4096)
  max_upload_mb: int(1,500)
  import_dir: str?
  create_structure: bool?
