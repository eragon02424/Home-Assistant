name: "Video-Auswertung"
description: "Wertet Videos per Link aus (Beschreibung, Sprache mit Zeitstempeln, Bilder im festen Raster von 500 Millisekunden) und stellt das Ergebnis per MCP bereit"
version: "0.3.0"
slug: "mcp_video_analysis"
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
homeassistant_api: true
ports:
  8771/tcp: 8771
ports_description:
  8771/tcp: "MCP (Streamable HTTP unter /mcp)"
options:
  stt_pipeline_name: "Home Assistant Cloud"
  retention_days: 10
  max_duration_minutes: 30
  min_free_gb: 20
  frame_base_url: "http://192.168.178.76:8771"
schema:
  stt_pipeline_name: str
  retention_days: int(1,365)
  max_duration_minutes: int(1,180)
  min_free_gb: float(1,1000)
  frame_base_url: str
